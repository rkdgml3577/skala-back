server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:shopdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: create   # 시작할 때 테이블 자동 생성
    show-sql: true       # 실행되는 SQL 콘솔에 보기
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true      # H2 웹 콘솔 켜기

management:
  endpoints:
    web:
      exposure:
        include: "*"  # 모든 엔드포인트 노출
  endpoint:
    health:
      show-details: always